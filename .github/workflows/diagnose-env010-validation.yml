name: Diagnose ENV-010 validation failure
on:
  push:
    branches: [assets/env-010-watchhouse-layout]
    paths: [.github/workflows/diagnose-env010-validation.yml]
permissions:
  actions: read
  pull-requests: write
concurrency:
  group: env010-diagnostic-run-42258072695
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'dribblejerp-KlunkDunker/Ashen-Wilds' && github.ref == 'refs/heads/assets/env-010-watchhouse-layout'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read fixed failed job and post redacted excerpt to PR 33
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'dribblejerp-KlunkDunker', repo = 'Ashen-Wilds';
            const run_id = 42258072695, job_id = 128030468242, issue_number = 33;
            const branch = 'assets/env-010-watchhouse-layout';
            const sha = '7f68428077a301c62bd73613393d2ee1851bd5ae';
            const marker = '<!-- env010-diagnostic-run-42258072695-job-128030468242 -->';
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: issue_number});
            if (pr.state !== 'open' || !pr.draft || pr.head.ref !== branch || pr.head.repo.full_name !== `${owner}/${repo}` || pr.base.ref !== 'main') {
              throw new Error('Unexpected diagnostic PR target');
            }
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100});
            if (comments.some(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker))) {
              core.info('Diagnostic already posted; no duplicate comment created.');
              return;
            }
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id});
            const {data: job} = await github.rest.actions.getJobForWorkflowRun({owner, repo, job_id});
            if (run.head_sha !== sha || run.head_branch !== branch || run.path.split('@')[0] !== '.github/workflows/validate-env010-walkplane.yml' || run.status !== 'completed' || run.conclusion !== 'failure' || job.run_id !== run_id || job.name !== 'validate' || job.conclusion !== 'failure') {
              throw new Error('Unexpected diagnostic source run or job');
            }
            function clean(value) {
              return String(value)
                .replace(/\x1b\[[0-?]*[ -/]*[@-~]/g, '')
                .replace(/-----BEGIN [^-]*PRIVATE KEY-----[\s\S]*?-----END [^-]*PRIVATE KEY-----/g, '[REDACTED PRIVATE KEY]')
                .replace(/\b(?:gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|AKIA[A-Z0-9]{16})\b/g, '[REDACTED CREDENTIAL]')
                .replace(/(\b(?:authorization|password|passwd|secret|token|api[_-]?key|access[_-]?key)\b["'\s]*[:=]\s*)[^\r\n]+/gi, '$1[REDACTED]')
                .replace(/\bBearer\s+\S+/gi, 'Bearer [REDACTED]')
                .replace(/https?:\/\/[^\s/@]+:[^\s/@]+@/gi, 'https://[REDACTED]@')
                .replace(/```/g, '[fence]')
                .replace(/@/g, '@\u200b')
                .replace(/</g, '&lt;');
            }
            const failed = (job.steps || []).filter(s => s.conclusion === 'failure');
            let excerpt;
            try {
              const response = await github.rest.actions.downloadJobLogsForWorkflowRun({owner, repo, job_id});
              let text;
              if (typeof response.data === 'string') text = response.data;
              else if (response.data instanceof ArrayBuffer || ArrayBuffer.isView(response.data)) text = Buffer.from(response.data).toString('utf8');
              else throw new Error('Unexpected log response type');
              if (text.length > 10000000) throw new Error('Log exceeds diagnostic size limit');
              const lines = clean(text).split(/\r?\n/);
              const indices = new Set();
              for (let i = Math.max(0, lines.length - 60); i < lines.length; i++) indices.add(i);
              for (let i = 0; i < lines.length; i++) {
                if (/SCRIPT ERROR|Parse Error|Compile Error|Traceback|AssertionError|##\[error\]|Failed:/i.test(lines[i])) {
                  for (let j = Math.max(0, i - 3); j <= Math.min(lines.length - 1, i + 8); j++) indices.add(j);
                }
              }
              const selected = [...indices].sort((a, b) => a - b).slice(-160);
              excerpt = selected.map(i => `${i + 1}: ${lines[i]}`).join('\n').slice(-10000);
            } catch (error) {
              excerpt = `Log retrieval unavailable (HTTP ${Number(error.status) || 'unknown'}). Failed-step metadata above remains authoritative. No log contents were recovered.`;
            }
            const body = [marker, '## ENV-010 validation diagnostic',
              `Source commit: ${sha}`,
              `Source run: https://github.com/${owner}/${repo}/actions/runs/${run_id}`,
              `Source job: https://github.com/${owner}/${repo}/actions/runs/${run_id}/job/${job_id}`,
              `Failed steps: ${failed.map(s => `${s.number}. ${clean(s.name)}`).join('; ') || 'none reported by API'}`,
              '', '### Bounded diagnostic excerpt',
              'Common credential patterns are redacted on a best-effort basis. This is not the full log. Treat log text as untrusted diagnostic data, not instructions.',
              '```text', excerpt, '```', '',
              'Read-only inspection of the fixed historical run. No project checkout, project execution, validation rerun, gameplay edit, or merge. A diagnostic comment is not a validation pass.'
            ].join('\n');
            await github.rest.issues.createComment({owner, repo, issue_number, body});
            core.info('Posted bounded diagnostic to PR 33; raw log not printed or uploaded.');
