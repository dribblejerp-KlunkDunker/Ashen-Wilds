name: Recover procedural prop render evidence
on:
  push:
    branches: [tooling/asset-code-pipeline]
    paths: [.github/workflows/recover-prop-evidence.yml]
permissions:
  actions: read
  contents: write
concurrency:
  group: recover-props-run-42728942625
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'dribblejerp-KlunkDunker/Ashen-Wilds' && github.ref == 'refs/heads/tooling/asset-code-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download only the fixed historical render artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: dribblejerp-KlunkDunker/Ashen-Wilds
          run-id: 42728942625
          pattern: procedural-props-*
          merge-multiple: true
          path: recovered-props
      - name: Install contact-sheet image reader
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
      - name: Verify provenance and publish isolated evidence branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import base64, hashlib, io, json, os, subprocess
          from pathlib import Path
          from PIL import Image, ImageDraw
          repo = "dribblejerp-KlunkDunker/Ashen-Wilds"
          branch = "evidence/procedural-props-b9b3195"
          source = "b9b31955f63d3a28e8f2a2827cd92af8316861e9"
          def api(endpoint, payload=None):
              command = ["gh", "api", "repos/" + repo + "/" + endpoint]
              if payload is None:
                  result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True)
              else:
                  command += ["--method", "POST", "--input", "-"]
                  result = subprocess.run(command, input=json.dumps(payload), stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True)
              if result.returncode:
                  raise RuntimeError("GitHub API request failed: " + endpoint.split("?")[0])
              return json.loads(result.stdout)
          run = api("actions/runs/42728942625")
          assert run["head_sha"] == source and run["head_branch"] == "tooling/asset-code-pipeline"
          assert run["status"] == "completed" and run["conclusion"] == "success"
          assert run["path"].split("@")[0] == ".github/workflows/validate-procedural-pack.yml"
          folder = Path("recovered-props")
          report = json.loads((folder / "report.json").read_text())
          assert report["source_commit"] == source and report["scene_count"] == 32 and report["images_written"] == 128
          assert report["engine"] == "4.7.2.stable.official.ed1daf0bf"
          kinds = ["pillar", "crate", "barrel", "fence", "bench", "wall", "rubble", "stump"]
          expected = {"%s_%02d-view-%d.png" % (kind, variant, view) for kind in kinds for variant in range(1, 5) for view in range(4)}
          assert {p.name for p in folder.glob("*.png")} == expected
          blobs = []
          metadata = {"source_run": 42728942625, "source_commit": source, "engine": report["engine"], "original_image_count": 128, "sheets": [], "visual_review": "NOT REVIEWED", "note": "Contact sheets are reduced-size JPEG derivatives, not original PNGs. Original images remain in the source artifact."}
          def store(path, content):
              response = api("git/blobs", {"encoding": "base64", "content": base64.b64encode(content).decode("ascii")})
              blobs.append({"path": path, "mode": "100644", "type": "blob", "sha": response["sha"]})
          for view in range(4):
              sheet = Image.new("RGB", (1024, 608), (30, 32, 29))
              draw = ImageDraw.Draw(sheet)
              draw.text((8, 8), "Actual Godot render evidence - view %d - source b9b3195 - NOT VISUALLY APPROVED" % view, fill=(235, 235, 220))
              for index, (kind, variant) in enumerate((kind, variant) for kind in kinds for variant in range(1, 5)):
                  name = "%s_%02d-view-%d.png" % (kind, variant, view)
                  with Image.open(folder / name) as image:
                      assert image.format == "PNG" and image.size == (320, 320)
                      tile = image.convert("RGB").resize((128, 128), Image.Resampling.LANCZOS)
                  x, y = (index % 8) * 128, 28 + (index // 8) * 144
                  sheet.paste(tile, (x, y))
                  draw.text((x + 3, y + 129), "%s_%02d" % (kind, variant), fill=(235, 235, 220))
              output = io.BytesIO()
              sheet.save(output, format="JPEG", quality=85, optimize=True)
              data = output.getvalue()
              name = "view-%d.jpg" % view
              store(name, data)
              encoded = base64.b64encode(data).decode("ascii")
              chunks = [encoded[i:i+6000] for i in range(0, len(encoded), 6000)]
              for index, chunk in enumerate(chunks):
                  store("encoded/view-%d-part-%03d.txt" % (view, index), chunk.encode("ascii"))
              metadata["sheets"].append({"file": name, "sha256": hashlib.sha256(data).hexdigest(), "base64_parts": len(chunks), "base64_characters": len(encoded)})
          store("index.json", (json.dumps(metadata, indent=2) + "\n").encode())
          store("README.md", ("# Procedural prop render evidence\n\nSource: https://github.com/" + repo + "/actions/runs/42728942625\n\nFour reduced-size labeled JPEG contact sheets cover all 32 assets from four views. These were composed from the actual run images, not recreated geometry. JPEG conversion and downsampling limit fine-detail inspection. No visual approval or traversal proof is implied. Original PNGs remain in the source artifact. Encoded text parts permit authenticated retrieval through text-only tools; join in numeric order, base64-decode, and verify SHA-256 against index.json.\n").encode())
          tree = api("git/trees", {"tree": blobs})
          commit = api("git/commits", {"message": "Publish verified render contact sheets from run 42728942625", "tree": tree["sha"], "parents": []})
          # Creation only: never update an existing ref and never write main.
          result = api("git/refs", {"ref": "refs/heads/" + branch, "sha": commit["sha"]})
          print("Evidence published to " + result["ref"])
          PY
