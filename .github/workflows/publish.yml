# Playtest builds for every update (appendix §90, §91).
#
# Every pull request and every push to main: export all five builds (Linux x86_64 and ARM64
# clients, the Linux dedicated server, Windows, and the browser build), prove the exported Linux
# server and client run against each other on loopback (tools/net_spike.py --exported), and keep
# the desktop zips as a workflow artifact for 14 days.
#
# On main only, after that test passes:
#   - the browser build goes to GitHub Pages: https://<owner>.github.io/<repo>/ (the single-player
#     prototype; a browser cannot use the courtyard's UDP transport). One-time setup by the owner:
#     Settings > Pages > Build and deployment > Source: GitHub Actions.
#   - the desktop zips replace the assets of the rolling pre-release tagged `playtest`, so
#     https://github.com/<owner>/<repo>/releases/tag/playtest always holds the newest main build.
#
# The export templates (release builds only, ~200 MB of the 1.07 GB archive) are cached; see
# tools/get_export_templates.sh.
name: publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot 4.7.2-stable
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.7.2-stable-linux-x86_64
      - name: Get Godot 4.7.2-stable
        run: |
          if [ ! -x ~/godot/Godot_v4.7.2-stable_linux.x86_64 ]; then
            mkdir -p ~/godot && cd ~/godot
            curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
            unzip -o godot.zip && rm godot.zip
          fi
          ~/godot/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Cache export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-stable-templates-${{ hashFiles('tools/get_export_templates.sh') }}
      - name: Get export templates
        run: tools/get_export_templates.sh
      - name: Export all builds
        run: GODOT=~/godot/Godot_v4.7.2-stable_linux.x86_64 tools/export_builds.sh
      - name: Run the exported server and client on loopback
        run: python3 tools/net_spike.py --exported builds
      - name: Package
        run: tools/package_builds.sh
      - name: Keep the desktop zips
        uses: actions/upload-artifact@v4
        with:
          name: playtest-builds
          path: builds/release/
          retention-days: 14
      - name: Hand the browser build to Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playtest-builds
          path: release
      - name: Replace the rolling playtest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PAGES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          {
            echo "Newest build of \`main\` (${GITHUB_SHA::7}), replaced on every merge. Internal playtest build, not a release candidate."
            echo
            echo "**Play in the browser (single-player prototype):** $PAGES"
            echo
            echo "**Downloads:** pick the zip for your machine below. On a Chromebook, run \`uname -m\` in the Linux terminal: \`x86_64\` or \`aarch64\` (ARM64)."
            echo
            echo '```'
            cat release/BUILD_INFO.txt
            echo '```'
          } > notes.md
          gh release delete playtest --repo "$REPO" --yes --cleanup-tag || true
          gh release create playtest release/*.zip --repo "$REPO" --target "$GITHUB_SHA" --prerelease \
            --title "Playtest build: latest main (${GITHUB_SHA::7})" --notes-file notes.md
