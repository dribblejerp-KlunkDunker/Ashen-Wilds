name: Generate and validate environment assets

on:
  push:
    branches: [assets/env-001-crate-barrel]
    paths:
      - ".github/workflows/build-environment-assets.yml"
      - "tools/generate_env*.py"
      - "tools/env_variation_common.py"
      - "tests/test_env006_collisions.gd"
      - "tests/test_env007_collisions.gd"
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: generate-environment-assets
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/assets/env-001-crate-barrel'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: assets/env-001-crate-barrel
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install mesh dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.13.1

      - name: Generate visuals and ENV-006/007 collision scenes
        shell: bash
        run: |
          set -euo pipefail
          for batch in 001 002 003 004 005 006 007; do
            if [ "$batch" = "006" ] || [ "$batch" = "007" ]; then
              python "tools/generate_env${batch}.py" "assets/environment/env${batch}"
            else
              python "tools/generate_env${batch}.py"
            fi
          done
          python tools/generate_env007_collisions.py assets/environment/env007 --replace-existing
          python tools/generate_env006_collisions.py assets/environment/env006 --replace-existing

      - name: Verify GLB headers
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          for batch in range(1, 8):
              files = sorted(Path(f"assets/environment/env{batch:03d}").rglob("*.glb"))
              if not files:
                  raise SystemExit(f"No GLBs in batch {batch}")
              for p in files:
                  raw = p.read_bytes()
                  if len(raw) < 12 or struct.unpack_from("<4sII", raw) != (b"glTF", 2, len(raw)):
                      raise SystemExit(f"Bad GLB header: {p}")
              print(f"ENV-{batch:03d}: {len(files)} GLB headers verified")
          PY

      - name: Import and run both suites in isolated Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q -o "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          engine="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$engine"
          "$engine" --version
          validation="$RUNNER_TEMP/ashen-asset-validation"
          mkdir -p "$validation/assets/environment"
          cp -R assets/environment/. "$validation/assets/environment/"
          cp tests/test_env00{6,7}_collisions.gd "$validation/"
          cat > "$validation/project.godot" <<'GODOT'
          config_version=5
          [application]
          config/name="Ashen asset validation"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          GODOT
          timeout 180s "$engine" --headless --path "$validation" --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/asset-import.log"
          for batch in 006 007; do
            timeout 180s "$engine" --headless --path "$validation" --script "res://test_env${batch}_collisions.gd" 2>&1 | tee "$RUNNER_TEMP/asset-env${batch}-physics.log"
          done
          python - <<'PY'
          from pathlib import Path
          import json, os
          root = Path(os.environ["RUNNER_TEMP"]) / "ashen-asset-validation"
          lines = []
          for batch, expected, filename in [("006", 60, "env006-validation-report.json"), ("007", 48, "validation-report.json")]:
              report = json.loads((root / filename).read_text())
              if not report.get("passed") or report.get("scene_pose_cases") != expected:
                  raise SystemExit(f"ENV-{batch} Godot validation failed")
              lines.append(f"- ENV-{batch}: {expected} scene/pose cases; {report['checks']} checks passed")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Godot asset validation passed\n" + "\n".join(lines) + "\n")
              f.write("Scope: isolated imports, collider structure and physics queries; not player traversal or performance.\n")
          PY

      - name: Commit outputs only after both engine suites pass
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          files = []
          for batch in range(1, 8):
              for p in sorted(Path(f"assets/environment/env{batch:03d}").rglob("*")):
                  if p.is_file() and (p.suffix == ".glb" or p.name.endswith("_collision.tscn") or p.name.endswith("manifest.json") or p.name == "generated-assets.json"):
                      files.append(str(p))
          subprocess.run(["git", "add", "-f", "--", *files], check=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Generated assets already match validated files." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Generate Godot-validated ENV-006 and ENV-007 collision scenes"
            git push origin HEAD:refs/heads/assets/env-001-crate-barrel
          fi

      - name: Keep validation logs and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asset-validation-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/asset-import.log
            ${{ runner.temp }}/asset-env*-physics.log
            ${{ runner.temp }}/ashen-asset-validation/*validation-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Keep generated asset backup
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: environment-assets-${{ github.run_number }}
          path: |
            assets/environment/env*/**/*.glb
            assets/environment/env00*/scenes/*_collision.tscn
            assets/environment/env00*/collision-manifest.json
          if-no-files-found: error
          retention-days: 14
