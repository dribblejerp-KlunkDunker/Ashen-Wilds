name: Validate procedural prop pack
on:
  push:
    branches: [tooling/asset-code-pipeline]
    paths:
      - assets/procedural_pack/**
      - .github/workflows/validate-procedural-pack.yml
  pull_request:
    branches: [main]
    paths:
      - assets/procedural_pack/**
      - .github/workflows/validate-procedural-pack.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: procedural-pack-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-props:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Prepare evidence and engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-artifacts/props "$RUNNER_TEMP/godot"
          git rev-parse HEAD > validation-artifacts/props/source-commit.txt
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Compile and test all 32 scenes twice
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --version | tee validation-artifacts/props/engine-version.log
          test "$(cat validation-artifacts/props/engine-version.log)" = "4.7.2.stable.official.ed1daf0bf"
          "$GODOT" --headless --path . --import 2>&1 | tee validation-artifacts/props/import.log
          for file in factory.gd test_pack.gd; do
            "$GODOT" --headless --path . --check-only --script "res://assets/procedural_pack/$file" 2>&1 | tee "validation-artifacts/props/compile-$file.log"
          done
          for iteration in 1 2; do
            timeout 120s "$GODOT" --headless --path . --script res://assets/procedural_pack/test_pack.gd 2>&1 | tee "validation-artifacts/props/test-$iteration.log"
            grep -q 'PROCEDURAL_PACK checked=32 failures=0;' "validation-artifacts/props/test-$iteration.log"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path("validation-artifacts/props").glob("*.log"):
              bad = [line for line in path.read_text().splitlines() if re.search(r"SCRIPT ERROR|Parse Error|Compile Error|ERROR:", line) and 'Parameter "m" is null' not in line]
              assert not bad, (str(path), bad)
          PY
      - name: Install software renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth mesa-vulkan-drivers
      - name: Render each prop from four views
        shell: bash
        run: |
          set -euo pipefail
          cat > .capture-props.gd <<'GD'
          extends SceneTree
          func _initialize() -> void:
              call_deferred("_run")
          func _run() -> void:
              root.size = Vector2i(320, 320)
              var stage := Node3D.new()
              root.add_child(stage)
              var environment := WorldEnvironment.new()
              var settings := Environment.new()
              settings.background_mode = Environment.BG_COLOR
              settings.background_color = Color(0.12, 0.13, 0.12)
              settings.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
              settings.ambient_light_color = Color(0.7, 0.7, 0.65)
              settings.ambient_light_energy = 0.7
              environment.environment = settings
              stage.add_child(environment)
              var light := DirectionalLight3D.new()
              light.rotation_degrees = Vector3(-45, -35, 0)
              light.light_energy = 1.2
              stage.add_child(light)
              var camera := Camera3D.new()
              camera.projection = Camera3D.PROJECTION_ORTHOGONAL
              stage.add_child(camera)
              camera.make_current()
              var kinds: Array[String] = ["pillar", "crate", "barrel", "fence", "bench", "wall", "rubble", "stump"]
              var written: int = 0
              for kind in kinds:
                  for variant in range(1, 5):
                      var packed := load("res://assets/procedural_pack/%s_%02d.tscn" % [kind, variant]) as PackedScene
                      if packed == null:
                          quit(1)
                          return
                      var prop: Node3D = packed.instantiate() as Node3D
                      stage.add_child(prop)
                      await process_frame
                      await process_frame
                      var generated := prop.get_node_or_null("Generated") as Node3D
                      if generated == null:
                          quit(1)
                          return
                      var bounds := AABB()
                      var first: bool = true
                      for child in generated.get_children():
                          if child is MeshInstance3D:
                              var visual := child as MeshInstance3D
                              var piece: AABB = visual.transform * visual.mesh.get_aabb()
                              bounds = piece if first else bounds.merge(piece)
                              first = false
                      if first or bounds.size.length() <= 0.0:
                          quit(1)
                          return
                      var center: Vector3 = bounds.get_center()
                      var distance: float = maxf(bounds.size.length() * 2.0, 3.0)
                      camera.size = maxf(bounds.size.length() * 1.25, 1.0)
                      for view in range(4):
                          var angle: float = deg_to_rad(45.0 + float(view) * 90.0)
                          camera.position = center + Vector3(sin(angle), 0.57735, cos(angle)) * distance
                          camera.look_at(center, Vector3.UP)
                          await process_frame
                          await process_frame
                          await RenderingServer.frame_post_draw
                          var image: Image = root.get_texture().get_image()
                          var path: String = "res://validation-artifacts/props/%s_%02d-view-%d.png" % [kind, variant, view]
                          if image.save_png(path) != OK:
                              quit(1)
                              return
                          written += 1
                      prop.queue_free()
                      await process_frame
              print("PROP_RENDER written=%d; image existence is not visual approval" % written)
              quit(0 if written == 128 else 1)
          GD
          timeout 600s xvfb-run -a -s "-screen 0 640x480x24" "$GODOT" --path . --audio-driver Dummy --rendering-driver vulkan --script res://.capture-props.gd 2>&1 | tee validation-artifacts/props/render.log
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          folder = Path("validation-artifacts/props")
          text = (folder / "render.log").read_text()
          assert not re.search(r"SCRIPT ERROR|Parse Error|Compile Error|ERROR:", text), text
          expected = {"%s_%02d-view-%d.png" % (kind, variant, view) for kind in ["pillar", "crate", "barrel", "fence", "bench", "wall", "rubble", "stump"] for variant in range(1, 5) for view in range(4)}
          images = list(folder.glob("*.png"))
          assert {p.name for p in images} == expected and all(p.stat().st_size > 0 for p in images)
          report = {"source_commit": (folder / "source-commit.txt").read_text().strip(), "engine": (folder / "engine-version.log").read_text().strip(), "scene_count": 32, "structure_runs": 2, "images_written": len(images), "visual_review": "NOT REVIEWED", "player_traversal": "NOT TESTED"}
          (folder / "report.json").write_text(json.dumps(report, indent=2))
          PY
      - name: Keep logs and unreviewed rendered views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procedural-props-${{ github.run_number }}
          path: validation-artifacts/props/
          if-no-files-found: warn
          retention-days: 14
