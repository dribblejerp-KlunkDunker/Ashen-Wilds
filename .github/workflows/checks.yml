name: Checks

# Every push and pull request: the scripts parse, the no-browser tests pass, the offline list is current,
# and the game is played in a headless browser. Software rendering: nothing here measures speed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Syntax, land and words, offline list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Every script parses
        run: |
          for f in js/*.js sw.js test/*.js tools/*.js tools/pwa/*.js; do node --check "$f"; done
      - name: Phase 0, the fork (no browser)
        run: node test/fork0.test.js --no-browser
      - name: Phase 1, the ledge (no browser)
        run: node test/ledge1.test.js --no-browser
      - name: Phase 2, our own art (no browser)
        run: node test/art2.test.js --no-browser
      - name: The offline list and the icons are current
        run: |
          node tools/pwa/precache.js --check
          node tools/icons.js --check

  browser:
    name: Played in a headless browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Install Playwright and Chromium (test tools only; nothing is bundled with the game)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Phase 0, the fork
        run: node test/fork0.test.js
      - name: Phase 1, the ledge
        run: node test/ledge1.test.js
      - name: Phase 2, our own art
        run: node test/art2.test.js
