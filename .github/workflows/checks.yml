name: Checks

# Every push and pull request: the scripts parse, the no-browser tests pass, the offline list is current,
# and the game is played in a headless browser. Software rendering: nothing here measures speed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Syntax, land and words, offline list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Every script parses
        run: |
          for f in js/*.js sw.js test/*.js tools/*.js tools/pwa/*.js tools/look/*.js tools/lore/*.js; do node --check "$f"; done
      - name: Phase 0, the fork (no browser)
        run: node test/fork0.test.js --no-browser
      - name: Phase 1, the ledge (no browser)
        run: node test/ledge1.test.js --no-browser
      - name: Phase 2, our own art (no browser)
        run: node test/art2.test.js --no-browser
      - name: Phase 3, the sun's day (no browser)
        run: node test/sun3.test.js --no-browser
      - name: Phase 4, the walking bloom (no browser)
        run: node test/bloom4.test.js --no-browser
      - name: Phase 5, the door that holds (no browser)
        run: node test/door5.test.js --no-browser
      - name: Phase 6, sleet and ashfall (no browser)
        run: node test/weather6.test.js --no-browser
      - name: Phase 7, the lantern (no browser)
        run: node test/lantern7.test.js --no-browser
      - name: Phase 8, highland building (no browser)
        run: node test/building8.test.js --no-browser
      - name: Phase 9, dread (no browser)
        run: node test/dread9.test.js --no-browser
      - name: Phase 10, the panel and creation (no browser)
        run: node test/panel10.test.js --no-browser
      - name: Phase 19, noise and hearing (no browser)
        run: node test/hearing19.test.js --no-browser
      - name: Phase 23, commitment (no browser)
        run: node test/combat23.test.js --no-browser
      - name: Phase 32, the bestiary (no browser)
        run: node test/bestiary32.test.js --no-browser
      - name: Phase 27, the hearth (no browser)
        run: node test/hearth27.test.js --no-browser
      - name: Phase 36 support, the phone link (no browser)
        run: node test/touchlink36.test.js --no-browser
      - name: Phase 29, the chill (no browser)
        run: node test/chill29.test.js --no-browser
      - name: Phase 33, Act I (no browser)
        run: node test/actone33.test.js --no-browser
      - name: Phase 34, the three courts (no browser)
        run: node test/acttwo34.test.js --no-browser
      - name: Phase 35, the side arcs (no browser)
        run: node test/sidearcs35.test.js --no-browser
      - name: Phase 36, the eleven days (no browser)
        run: node test/actthree36.test.js --no-browser
      - name: Phase 37, the endings (no browser)
        run: node test/endings37.test.js --no-browser
      - name: Phase 39, the prologue played through (no browser)
        run: node test/prologue39.test.js --no-browser
      - name: Phase 40, walking from one map into the next (no browser)
        run: node test/threshold40.test.js --no-browser
      - name: Phase 41, streaming (no browser)
        run: node test/stream41.test.js --no-browser
      - name: Phase 42, one open country (no browser)
        run: node test/open42.test.js --no-browser
      - name: Phase 43, the places of the highland edge (no browser)
        run: node test/places43.test.js --no-browser
      - name: Phase 44, the blind quarry-troll (no browser)
        run: node test/troll44.test.js --no-browser
      - name: The lore pipeline, places (the gazetteer's 134 parse, docs/data/places.json is current)
        run: node test/lore-places.test.js --no-browser
      - name: The phase 19-23 wires against fake G (no browser)
        run: node test/wires19-23.test.js --no-browser
      - name: The highland materials look test (no browser)
        run: node test/highland-materials.test.js
      - name: Every test file, no browser (so a new phase cannot be left out of CI)
        run: |
          for f in test/*.test.js; do echo "== $f"; node "$f" --no-browser || exit 1; done
      - name: The offline list and the icons are current
        run: |
          node tools/pwa/precache.js --check
          node tools/icons.js --check
      - name: The zone sketches match the zone plan, and every way keeps the 30-to-60-second rule (O15)
        run: node tools/zones.js --check

  # One job per phase, run side by side: the whole set ran past 15 minutes in one job once Phase 6 came
  # (a slow runner took 5 minutes over Phase 4 alone). Each phase keeps its own 15 minute limit.
  phase:
    name: Played in a headless browser (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Phase 0, the fork', test: fork0 }
          - { name: 'Phase 1, the ledge', test: ledge1 }
          - { name: 'Phase 2, our own art', test: art2 }
          - { name: "Phase 3, the sun's day", test: sun3 }
          - { name: 'Phase 4, the walking bloom', test: bloom4 }
          - { name: 'Phase 5, the door that holds', test: door5 }
          - { name: 'Phase 6, sleet and ashfall', test: weather6 }
          - { name: 'Phase 7, the lantern', test: lantern7 }
          - { name: 'Phase 8, highland building', test: building8 }
          - { name: 'Phase 9, dread', test: dread9 }
          - { name: 'Phase 10, the panel and creation', test: panel10 }
          - { name: 'Phase 19, the co-op cut (two tabs)', test: sync19 }
          - { name: 'Phase 27, the hearth', test: hearth27 }
          - { name: 'Phase 32, the bestiary', test: bestiary32 }
          - { name: 'Phase 11, the opening look', test: opening11 }
          - { name: 'Phase 12, the company', test: company12 }
          - { name: 'Phase 13, the carter', test: carter13 }
          - { name: 'Phase 14, the Account', test: account14 }
          - { name: 'Phase 15, the carry', test: carry15 }
          - { name: 'Phase 16, the warning book', test: book16 }
          - { name: 'Phase 17, the kit', test: kit17 }
          - { name: 'Phase 18, the cards', test: cards18 }
          - { name: 'Phase 38, start with a torch', test: torch38 }
          - { name: 'Phase 39, the prologue played through', test: prologue39 }
          - { name: 'Phase 40, walking from one map into the next', test: threshold40 }
          - { name: 'Phase 41, streaming', test: stream41 }
          - { name: 'Phase 42, one open country', test: open42 }
          - { name: 'Phase 43, the places of the highland edge', test: places43 }
          - { name: 'Phase 44, the blind quarry-troll', test: troll44 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Install Playwright and Chromium (test tools only; nothing is bundled with the game)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"
      - name: ${{ matrix.name }}
        run: node test/${{ matrix.test }}.test.js

  # the check by its old name, green only when every phase above is
  browser:
    name: Played in a headless browser
    needs: phase
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every phase played
        run: test "${{ needs.phase.result }}" = "success"
