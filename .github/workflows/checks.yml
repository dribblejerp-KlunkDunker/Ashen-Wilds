# Compile-check every script and boot the game headless on every push and pull request.
# There is no regression suite yet: the game is a look test. Add one with the first gameplay.
name: checks
on:
  push:
  pull_request:
jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot 4.7.2-stable
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.7.2-stable-linux-x86_64
      - name: Get Godot 4.7.2-stable
        run: |
          if [ ! -x ~/godot/Godot_v4.7.2-stable_linux.x86_64 ]; then
            mkdir -p ~/godot && cd ~/godot
            curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
            unzip -o godot.zip && rm godot.zip
          fi
          ~/godot/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Compile-check
        run: |
          export GODOT=~/godot/Godot_v4.7.2-stable_linux.x86_64
          $GODOT --headless --path . --import >/dev/null 2>&1 || true
          fail=0
          for f in $(find scripts -name "*.gd" | sort); do
            out=$($GODOT --headless --path . --check-only --script "res://$f" 2>&1 | grep -E "ERROR|WARNING" || true)
            if [ -n "$out" ]; then echo "--- $f"; echo "$out"; fail=1; fi
          done
          test "$fail" = 0
      - name: Headless boot
        run: |
          out=$(~/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 120 2>&1 | grep -E "SCRIPT ERROR|Parse Error|Failed to load" || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
