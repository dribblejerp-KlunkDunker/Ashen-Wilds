<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Tally - M1 stress</title>
<style>
  :root { --bone: #e9e1c9; --ink: #0b0e0c; --tallow: #f2c26b; --dim: #8d8a7c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--bone); }
  body { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow: hidden; }
  canvas#game { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud {
    position: fixed; top: 12px; left: 14px; padding: 10px 12px;
    background: rgba(8, 11, 9, 0.78); border: 1px solid rgba(233, 225, 201, 0.12);
    border-radius: 3px; pointer-events: none; min-width: 300px;
  }
  #hud b { color: var(--tallow); font-weight: 600; }
  #hud .row { display: flex; gap: 14px; }
  #hud .k { color: var(--dim); }
  #graph {
    position: fixed; right: 14px; bottom: 14px; width: 360px; height: 96px;
    background: rgba(8, 11, 9, 0.78); border: 1px solid rgba(233, 225, 201, 0.12);
    border-radius: 3px; pointer-events: none;
  }
  #note {
    position: fixed; left: 14px; bottom: 14px; max-width: 52ch; opacity: 0.45;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div><b>M1 stress</b> &middot; <span id="n">0</span> goblins</div>
  <div class="row"><span><span class="k">fps</span> <span id="fps">--</span></span>
    <span><span class="k">avg</span> <span id="avg">--</span> ms</span>
    <span><span class="k">p95</span> <span id="p95">--</span> ms</span></div>
</div>

<canvas id="graph" width="360" height="96"></canvas>

<div id="note">
  Minimal M1 stress: Canvas 2D, one goblin type, no projectiles. The M2 target-count scene is
  separate. WASD / arrows walk &middot; Space step &middot; R recenter &middot; reload with
  <code>?n=1000</code> to change the horde.
</div>

<script type="module">
  import { createGame, spawnGoblin } from '../js/game.js';
  import { TILE } from '../js/sim/tuning.js';

  const canvas = document.getElementById('game');
  const graph = document.getElementById('graph');
  const gctx = graph.getContext('2d');
  const $ = (id) => document.getElementById(id);

  const params = new URLSearchParams(location.search);
  const asked = Number.parseInt(params.get('n') || '300', 10);
  const count = Number.isFinite(asked) ? Math.max(0, Math.min(2000, asked)) : 300;

  const samples = [];
  const MAX_SAMPLES = 180;
  let lastFrame = 0;
  let tick = 0;

  function drawGraph() {
    const w = graph.width;
    const h = graph.height;
    gctx.clearRect(0, 0, w, h);
    gctx.fillStyle = '#080b09';
    gctx.fillRect(0, 0, w, h);

    gctx.font = '10px ui-monospace, monospace';
    for (const ms of [16.7, 33.3, 50]) {
      const y = h - (ms / 50) * h;
      gctx.strokeStyle = ms === 16.7 ? 'rgba(169, 214, 154, 0.35)' : 'rgba(233, 225, 201, 0.14)';
      gctx.lineWidth = 1;
      gctx.beginPath();
      gctx.moveTo(0, y);
      gctx.lineTo(w, y);
      gctx.stroke();
      gctx.fillStyle = 'rgba(141, 138, 124, 0.7)';
      gctx.fillText(ms.toFixed(1), 4, Math.max(9, y - 2));
    }

    if (samples.length < 2) return;
    gctx.strokeStyle = '#f2c26b';
    gctx.lineWidth = 1.5;
    gctx.beginPath();
    for (let i = 0; i < samples.length; i++) {
      const x = (i / (MAX_SAMPLES - 1)) * w;
      const y = h - Math.min(1, samples[i] / 50) * h;
      if (i === 0) gctx.moveTo(x, y);
      else gctx.lineTo(x, y);
    }
    gctx.stroke();
  }

  function updateHud(fps) {
    const n = samples.length;
    if (!n) return;
    const avg = samples.reduce((s, v) => s + v, 0) / n;
    const sorted = [...samples].sort((a, b) => a - b);
    const p95 = sorted[Math.min(n - 1, Math.floor(n * 0.95))];
    $('fps').textContent = fps ? fps.toFixed(0) : '--';
    $('avg').textContent = avg.toFixed(1);
    $('p95').textContent = p95.toFixed(1);
  }

  const game = createGame(canvas, {
    goblins: 0,
    dummies: false,
    embers: false,
    onFrame(world, { fps }) {
      const now = performance.now();
      if (lastFrame) {
        samples.push(now - lastFrame);
        if (samples.length > MAX_SAMPLES) samples.shift();
      }
      lastFrame = now;
      tick++;
      if (tick % 6 === 0) updateHud(fps);
      drawGraph();
    },
  });

  const p = game.world.player;
  for (let i = 0; i < count; i++) {
    const angle = i * 2.399963229728653;                    // golden angle, even spread
    const radius = (3 + 12 * Math.sqrt((i + 0.5) / Math.max(1, count))) * TILE;
    const x = Math.max(TILE + 20, Math.min(39 * TILE - 20, p.x + Math.cos(angle) * radius));
    const y = Math.max(TILE + 20, Math.min(23 * TILE - 20, p.y + Math.sin(angle) * radius));
    spawnGoblin(game.world, x, y);
  }
  $('n').textContent = String(count);

  game.start();
  window.tally = game;
</script>
</body>
</html>
